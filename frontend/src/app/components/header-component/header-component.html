<header class="main-header">
  <div class="header-container">
    <!-- Logo/Brand -->
    <div class="brand">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 6h-2V4c0-1.11-.89-2-2-2H8c-1.11 0-2 .89-2 2v2H4c-1.11 0-2 .89-2 2v11c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM8 4h8v2H8V4zm12 15H4V8h2v1c0 .55.45 1 1 1s1-.45 1-1V8h8v1c0 .55.45 1 1 1s1-.45 1-1V8h2v11z"/>
        </svg>
        <h1 class="brand-title">JobsAPI</h1>
      </div>
      <p class="brand-subtitle">Conectando talentos e oportunidades</p>
    </div>

    <!-- Navigation -->
    <nav class="main-nav">
      <ul class="nav-list">
        <li><a href="/jobs" routerLinkActive="active" class="nav-link active">Vagas</a></li>
        <li><a href="/companies" routerLinkActive="active" class="nav-link">Empresas</a></li>
        <li><a href="#" class="nav-link">Candidatos</a></li>
        <li><a href="#" class="nav-link">Sobre</a></li>
      </ul>
    </nav>

    <!-- Actions -->
    <div class="header-actions">
      <button class="btn-secondary">Login</button>
      <button class="btn-primary">Cadastrar</button>
    </div>

    <!-- Mobile menu toggle -->
    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav" [class.active]="mobileMenuOpen">
    <ul class="mobile-nav-list">
      <li><a href="/jobs" routerLinkActive="active" class="mobile-nav-link">Vagas</a></li>
      <li><a href="/companies" routerLinkActive="active" class="mobile-nav-link">Empresas</a></li>
      <li><a href="#" class="mobile-nav-link">Candidatos</a></li>
      <li><a href="#" class="mobile-nav-link">Sobre</a></li>
      <li class="mobile-actions">
        <button class="btn-secondary mobile-btn">Login</button>
        <button class="btn-primary mobile-btn">Cadastrar</button>
      </li>
    </ul>
  </nav>
</header>
